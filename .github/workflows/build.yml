name: Build Project

# Sự kiện kích hoạt workflow (chạy khi có push hoặc pull request lên nhánh main)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Chọn hệ điều hành cho máy chủ ảo (ubuntu-latest, windows-latest, macos-latest)
    runs-on: ubuntu-latest

    steps:
    # 1. Tải mã nguồn từ repository về máy chủ ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường (Ví dụ: .NET SDK)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Tải các gói phụ thuộc (dependencies)
    - name: Restore dependencies
      run: dotnet restore

    # 4. Thực hiện lệnh build dự án
    - name: Build application
      run: dotnet build --configuration Release --no-restore
