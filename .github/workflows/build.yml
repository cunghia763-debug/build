name: Build InjectFix Patch
on:
  workflow_dispatch: # Cho phép kích hoạt thủ công

jobs:
  build-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Nếu dự án dùng Git LFS

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Run InjectFix Patch Generation
        uses: game-ci/unity-builder@v4 # Hoặc dùng image unity trực tiếp
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android # Hoặc iOS, tùy platform bạn muốn tạo patch
          # Quan trọng: Gọi hàm Editor của bạn thay vì build game
          buildMethod: YourNamespace.PatchBuilder.GeneratePatch 
          # Nếu dùng custom method, có thể cần tắt tính năng build mặc định
          # customParameters: -executeMethod YourNamespace.PatchBuilder.GeneratePatch
